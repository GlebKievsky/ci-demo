name: Release
on:
  push:
    tags: [ "v*" ]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Test
      run: dotnet test
    - name: Publish gradecalc.exe
      run: dotnet publish src/Grades.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: gradecalc-win-x64
        path: publish/gradecalc.exe
    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{ github.ref_name }} publish/gradecalc.exe --generate-notes
